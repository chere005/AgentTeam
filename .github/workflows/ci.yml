name: Desktop checks
# A failed run mails the repository owner, so nothing is checked here that has not passed a
# preflight first (scripts/preflight.sh): CI runs on main pushes and on preflight/** branches
# only. On a preflight branch a failing job does not fail the run (job-level continue-on-error),
# so no mail goes out; the script reads each job's own conclusion and says pass or fail.
# .githooks/pre-push refuses main or a v* tag whose commit has not passed preflight.
on:
  push:
    branches: [main, "preflight/**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # macOS decides. Windows and Linux are informational (optional) until their known
    # failures are fixed (TODO.md): they run and report but never fail the run.
    name: check (${{ matrix.os }}${{ matrix.optional && ', optional' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            optional: false
          - os: windows-latest
            optional: true
          - os: ubuntu-latest
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional || startsWith(github.ref, 'refs/heads/preflight/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: node scripts/audit-release.mjs
      - run: npm run typecheck
      - run: npm test
      - if: runner.os != 'Linux'
        run: npm run test:ui
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ui
      # No artifact upload: the account's Actions artifact storage quota fills up and then the upload fails the job.
      # The failing tests are in the log above; this lists what Playwright kept.
      - if: failure()
        shell: bash
        run: ls -R test-results 2>/dev/null | head -100 || true
