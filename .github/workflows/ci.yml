name: Desktop checks
# CI runs on main pushes and on preflight/** branches (scripts/preflight.sh pushes one, reads each
# job's own conclusion and says pass or fail); .githooks/pre-push refuses main or a v* tag whose
# commit has not passed preflight. Preflight branches also run the `installers` jobs (the release's installer gates; nothing is published).
#
# QUIET CI (AgentSuite's ci.md and tools/check-workflows.py in Sean's checkout). GitHub mails a run's outcome to whoever
# TRIGGERED it. So a run a person starts (a push, `gh workflow run`, a re-run) only runs `handoff`, which re-dispatches this
# workflow as github-actions[bot] (GITHUB_TOKEN); the bot's run does the work, and nobody is mailed whatever happens to it - a
# red test, a timeout, a runner GitHub never provides. Every job is also `continue-on-error`, so even the bot's run stays
# green; scripts/preflight.sh reads each job.
on:
  push:
    branches: [main, "preflight/**"]
  workflow_dispatch:
permissions:
  contents: read
# A person's run (handoff only) gets a group of its own: it must never queue behind, or be cancelled by, the bot's run.
concurrency:
  group: ${{ github.triggering_actor != 'github-actions[bot]' && format('handoff-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  # A person's run does only this: hand the same work to the bot (see QUIET CI above). Identical in every workflow.
  handoff:
    name: Hand off to the bot
    if: github.triggering_actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      INPUTS: ${{ toJSON(inputs) }}
      # What a push hands over: a tag push releases that tag.
      PUSH_INPUTS: ${{ github.ref_type == 'tag' && format('{{"tag":"{0}"}}', github.ref_name) || '{}' }}
    steps:
      - name: Dispatch this workflow as github-actions[bot]
        shell: bash
        run: |
          set -euo pipefail
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then json="$INPUTS"; else json="$PUSH_INPUTS"; fi
          [ -n "$json" ] && [ "$json" != null ] || json='{}'
          json=$(jq -c 'with_entries(select(.value != null) | .value |= tostring)' <<< "$json")
          echo "dispatching $wf at $GITHUB_REF_NAME with $json"
          for i in 1 2 3 4 5; do
            if gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --json <<< "$json"; then
              echo "### Handed off to github-actions[bot]" >> "$GITHUB_STEP_SUMMARY"
              echo "The work runs in the bot's run of $wf on $GITHUB_REF_NAME (Actions tab)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((i * 10))
          done
          echo "::error title=Handoff failed::could not dispatch $wf; nothing was built"
          exit 1

  check:
    if: github.triggering_actor == 'github-actions[bot]'
    # macOS decides. Windows and Linux are informational (optional) until their known
    # failures are fixed (TODO.md): they run and report but never fail the run.
    name: check (${{ matrix.os }}${{ matrix.optional && ', optional' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            optional: false
          - os: windows-latest
            optional: true
          - os: ubuntu-latest
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: node scripts/audit-release.mjs
      - run: npm run typecheck
      - run: npm test
      - if: runner.os != 'Linux'
        run: npm run test:ui
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ui
      # No artifact upload: the account's Actions artifact storage quota fills up and then the upload fails the job.
      # The failing tests are in the log above; this lists what Playwright kept.
      - if: failure()
        shell: bash
        run: ls -R test-results 2>/dev/null | head -100 || true

  # The installer gates, on preflight branches only (scripts/preflight.sh): the same script the release runs
  # (scripts/installer-gates.mjs) builds and packages the app for each platform, inspects the package and smoke-launches it.
  # Nothing is uploaded or published. Apple Silicon macOS decides; Windows and Linux are informational like the checks.
  installers:
    if: github.triggering_actor == 'github-actions[bot]' && startsWith(github.ref_name, 'preflight/')
    name: installers (${{ matrix.os }}, ${{ matrix.arch }}${{ matrix.optional && ', optional' || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            optional: false
          - os: windows-latest
            arch: x64
            optional: true
          - os: ubuntu-latest
            arch: x64
            optional: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - if: runner.os != 'Linux'
        run: node scripts/installer-gates.mjs --${{ matrix.arch }} --smoke
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/installer-gates.mjs --${{ matrix.arch }} --smoke
